{% extends "tracker/base.html" %}{% block title %}Sign in · Zero{% endblock %}
{% block scripts %}<script>document.getElementById('show-pw').addEventListener('change', (e) => { document.getElementById('id_password').type = e.target.checked ? 'text' : 'password'; });</script>{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 22rem; padding-top: 2rem;">
<h1>Sign in</h1>
<p class="lede">Your debts, payments and the month.</p>
{% if form.errors %}<div class="alert alert-danger py-2">That username and password don't match.</div>{% endif %}
<form method="post" class="row g-2">{% csrf_token %}
  <div class="col-12"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" autocomplete="username" autofocus required></div>
  <div class="col-12"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="show-pw"><label class="form-check-label" for="show-pw">Show password</label></div></div>
  <input type="hidden" name="next" value="{{ next }}">
  <div class="col-12 mt-3"><button class="btn btn-accent w-100">Sign in</button></div>
</form>
</div>
{% endblock %}
