# Blueprint for reference. The service was created via the Render API; this file documents the shape.
services:
  - type: web
    name: repayment-ledger
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ledger.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: repayment-ledger-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: repayment-ledger.onrender.com
databases:
  - name: repayment-ledger-db
    plan: free
